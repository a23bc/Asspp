name: Build App

on:
  push:
    branches: [main, ios-15]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest non-beta Xcode
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            info="$app/Contents/Info.plist"
            [ -f "$info" ] || continue
            # Skip beta/release-candidate installs.
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
              *beta*|*_rc*) continue ;;
            esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          if [ -z "$best_path" ]; then
            echo "::error::No non-beta Xcode found"
            exit 1
          fi
          echo "Selected Xcode $best_ver at $best_path"
          sudo xcode-select -s "$best_path"
          xcodebuild -version

      - name: Ensure iOS platform is installed
        run: xcodebuild -downloadPlatform iOS || true

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Build
        run: |
          chmod +x Resources/Scripts/compile.release.mobile.ci.sh
          ./Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$(pwd)/Asspp.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asspp.ipa
          path: Asspp.ipa

      - name: Report availability errors
        if: always()
        run: |
          set -uo pipefail
          LOG=build/xcodebuild-ios.log
          if [ ! -f "$LOG" ]; then
            echo "### No build log produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Availability errors (grouped by required OS version)"
            echo '```'
            grep -oE "'.*' is only available in (iOS|macOS|tvOS) [0-9.]+ or newer" "$LOG" \
              | sort | uniq -c | sort -rn
            echo '```'
            echo "### Distinct errors"
            echo '```'
            grep -E "error: " "$LOG" | sed -E 's#.*/(Asspp|Configuration|Resources)/#\1/#' | sort -u | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ios-log
          path: build/xcodebuild-ios.log
          retention-days: 30

  build-osx:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest non-beta Xcode
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            info="$app/Contents/Info.plist"
            [ -f "$info" ] || continue
            # Skip beta/release-candidate installs.
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
              *beta*|*_rc*) continue ;;
            esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          if [ -z "$best_path" ]; then
            echo "::error::No non-beta Xcode found"
            exit 1
          fi
          echo "Selected Xcode $best_ver at $best_path"
          sudo xcode-select -s "$best_path"
          xcodebuild -version

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Build
        run: |
          chmod +x Resources/Scripts/compile.release.osx.sh
          ./Resources/Scripts/compile.release.osx.sh "$(pwd)" "$(pwd)/Asspp.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asspp.zip
          path: Asspp.zip
